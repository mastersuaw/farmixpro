services:
  mariadb:
    image: mariadb:11
    container_name: farmixpro-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: farmixpro
      MARIADB_USER: farmixpro
      MARIADB_PASSWORD: farmixpro
    ports:
      - "3306:3306"
    volumes:
      - farmixpro_mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: farmixpro-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8080:80"

volumes:
  farmixpro_mariadb_data:
